version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: industria-postgres
    environment:
      POSTGRES_DB: industriamonitor
      POSTGRES_USER: kaio
      POSTGRES_PASSWORD: industria123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: industria-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: industria-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: kaio
      RABBITMQ_DEFAULT_PASS: industria123
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data: